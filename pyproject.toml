[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adp-da"
version = "0.1.0"
description = "Data analysis and evaluation workspace for ADP Financial Privacy Gateway."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.116.1",
    "numpy==2.2.6",
    "pandas==2.3.2",
    "pydantic==2.11.7",
    "python-dotenv==1.1.1",
    "scikit-learn==1.7.1",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==1.17.1",
    "pytest==8.4.1",
    "ruff==0.12.10",
]
notebook = [
    "ipykernel==6.30.1",
    "jupyterlab==4.4.6",
    "matplotlib==3.10.5",
    "seaborn==0.13.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["adp_da"]
