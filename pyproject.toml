[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adp-da"
version = "0.1.0"
description = "Data analysis and evaluation workspace for ADP Financial Privacy Gateway."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema==4.25.1",
    "fastapi==0.116.1",
    "numpy==2.2.6",
    "openai==3.6.0",
    "pandas==2.3.2",
    "pydantic==2.11.7",
    "python-dotenv==1.1.1",
    "scikit-learn==1.7.1",
    "scipy==1.18.1",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==1.17.1",
    "pytest==8.4.1",
    "ruff==0.12.10",
]
notebook = [
    "pyarrow==23.0.1",
    "ipykernel==6.30.1",
    "jupyterlab==4.4.6",
    "matplotlib==3.10.5",
    "nbconvert==7.16.6",
    "nbformat==5.10.4",
    "seaborn==0.13.2",
]

[tool.setuptools.packages.find]
where = ["02_ai/src"]

[tool.pytest.ini_options]
testpaths = ["02_ai/tests"]
pythonpath = ["02_ai/src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Analyst-owned evidence snapshots: preserve cells/outputs, validate via handoff builder.
extend-exclude = [
    "03_digital_asset/notebooks/runtime_validation/DA_00_master_sample.ipynb",
    "03_digital_asset/notebooks/runtime_validation/DA_01_external_execution.ipynb",
    "03_digital_asset/notebooks/runtime_validation/DA_02_exact_preservation.ipynb",
    "03_digital_asset/notebooks/runtime_validation/DA_03_trace_binding.ipynb",
    "03_digital_asset/notebooks/runtime_validation/DA_05_approved_requested_match.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["adp_da"]
mypy_path = "02_ai/src"

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "scipy", "scipy.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true
