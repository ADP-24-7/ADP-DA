name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ADP-DA

    steps:
      - uses: actions/checkout@v4
        with:
          path: ADP-DA

      - name: Checkout BE Compose and P0 evaluation contract
        uses: actions/checkout@v4
        with:
          repository: nahee8034-ux/ADP-BE
          # Pin the matching producer contract while P0 is not on upstream main.
          ref: 3692e572da1ff09b040a3e80a863030282060c58
          path: ADP-BE

      - name: Validate Docker Compose
        run: |
          mkdir -p ../ADP-FE ../ADP-Docs
          docker compose \
            --project-directory ../ADP-BE \
            -f ../ADP-BE/docker-compose.yml \
            -f "$PWD/docker-compose.yml" \
            --profile test \
            config --quiet

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Typecheck
        run: python -m mypy 02_ai/src

      - name: Contract check
        run: python scripts/validate_contracts.py

      - name: Test
        run: python -m pytest 02_ai/tests

      - name: Digital Asset Test
        run: python -m pytest 03_digital_asset/tests
