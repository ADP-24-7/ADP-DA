services:
  adp-da:
    build:
      context: .
    container_name: adp-da
    env_file:
      - path: .env
        required: false
    ports:
      - "8010:8010"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    networks:
      - adp-local

networks:
  adp-local:
    external: true
