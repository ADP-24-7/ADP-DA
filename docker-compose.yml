# DA-only override. The integration stack, PostgreSQL volume, BE, and mock provider
# are owned by ../ADP-BE/docker-compose.yml and must be loaded first (see Makefile).
services:
  adp-be:
    environment:
      ADP_AI_CONNECTOR_READ_TIMEOUT: "${ADP_AI_CONNECTOR_READ_TIMEOUT:-60s}"

  adp-da:
    environment:
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: ${SERVICE_NAME:-adp-da}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GATEWAY_CORE_URL: http://adp-be:8080
      ADP_BE_BASE_URL: http://adp-be:8080
      ADP_RUNTIME_API_KEY: ${ADP_RUNTIME_API_KEY:-local-dev-api-key}
      ADP_BE_LOCAL_ADMIN_USER_ID: ${ADP_BE_LOCAL_ADMIN_USER_ID:-da-evaluation-reader}
      ADP_BE_LOCAL_ADMIN_ROLES: ${ADP_BE_LOCAL_ADMIN_ROLES:-PRIVILEGED_OPERATOR}
      ARTIFACT_OUTPUT_DIR: ${ARTIFACT_OUTPUT_DIR:-02_ai/artifacts}
    depends_on:
      adp-be:
        condition: service_healthy
