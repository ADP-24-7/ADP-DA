services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adp}
      POSTGRES_USER: ${POSTGRES_USER:-adp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - adp-da-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-adp} -d $${POSTGRES_DB:-adp}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - adp-local

  postgres-test:
    image: postgres:16-alpine
    profiles:
      - test
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: adp
      POSTGRES_USER: adp
      POSTGRES_PASSWORD: adp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adp -d adp"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - adp-local

  adp-be:
    build:
      context: ../ADP-BE
      dockerfile: Dockerfile.dev
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/adp}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-adp}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-adp}
      ADP_LOCAL_USER_AUTH_ENABLED: "${ADP_LOCAL_USER_AUTH_ENABLED:-true}"
      ADP_LOCAL_FIXTURES_ENABLED: "${ADP_LOCAL_FIXTURES_ENABLED:-true}"
      ADP_MOCK_RUNTIME_ENABLED: "${ADP_MOCK_RUNTIME_ENABLED:-true}"
      ADP_DATA_ACCESS_PREVIEW_ENABLED: "${ADP_DATA_ACCESS_PREVIEW_ENABLED:-true}"
      ADP_CONTEXT_PREVIEW_ENABLED: "${ADP_CONTEXT_PREVIEW_ENABLED:-true}"
    ports:
      - "${ADP_BE_PORT:-8080}:8080"
    volumes:
      - ../ADP-BE:/workspace
      - adp-be-gradle-cache:/home/gradle/.gradle
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    networks:
      - adp-local

  adp-fe:
    image: node:22.22.2-bookworm-slim
    working_dir: /workspace
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      VITE_APP_ENV: ${VITE_APP_ENV:-local}
      VITE_API_MODE: ${VITE_API_MODE:-real}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://adp-be:8080}
    ports:
      - "${ADP_FE_PORT:-5173}:5173"
    volumes:
      - ../ADP-FE:/workspace
      - adp-fe-node-modules:/workspace/node_modules
    depends_on:
      adp-be:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    networks:
      - adp-local

  adp-da:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: ${SERVICE_NAME:-adp-da}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GATEWAY_CORE_URL: ${GATEWAY_CORE_URL:-http://adp-be:8080}
      ARTIFACT_OUTPUT_DIR: ${ARTIFACT_OUTPUT_DIR:-artifacts}
    command: ["uvicorn", "adp_da.api:app", "--host", "0.0.0.0", "--port", "8010", "--reload"]
    ports:
      - "${ADP_DA_PORT:-8010}:8010"
    volumes:
      - .:/app
    depends_on:
      adp-be:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - adp-local

  adp-docs:
    image: node:20-alpine
    working_dir: /workspace
    command: ["sh", "-c", "npm ci && npm start -- --host 0.0.0.0 --port 3000"]
    ports:
      - "${ADP_DOCS_PORT:-3000}:3000"
    volumes:
      - ../ADP-Docs:/workspace
      - adp-docs-node-modules:/workspace/node_modules
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    networks:
      - adp-local

networks:
  adp-local:
    external: true

volumes:
  adp-da-postgres-data:
  adp-be-gradle-cache:
  adp-fe-node-modules:
  adp-docs-node-modules:
